<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Clases particulares de informática. Tarifas individuales y grupales." />
    <meta name="theme-color" content="#061b2d" />
    <title>Clases de informática</title>
    <style>
      :root { --ink:#061b2d; --panel:#0b2638; --lime:#c8ff32; --paper:#edf4f6; --muted:#9db5c2; --rule:#416074; }
      * { box-sizing:border-box; } html { background:var(--ink); }
      body { min-width:320px; margin:0; background:var(--ink); color:var(--paper); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      a:focus-visible { outline:3px solid var(--lime); outline-offset:4px; }
      .poster { width:min(100%,840px); min-height:100svh; margin:auto; border-inline:1px solid #29495a; background:var(--ink); }
      .masthead { padding:clamp(24px,5vw,42px) clamp(20px,6vw,52px) clamp(16px,3vw,28px); background:var(--ink); color:var(--paper); text-align:center; }
      h1,h2,h3,p { margin:0; } h1 { color:var(--lime); font-size:clamp(1.56rem,7.4vw,4.85rem); font-weight:750; line-height:1; letter-spacing:-.055em; white-space:nowrap; }
      .tarifas { padding:0 clamp(20px,6vw,52px) clamp(6px,2vw,14px); background:var(--ink); }
      .tarifa { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:baseline; padding:clamp(13px,3vw,21px) 0; }.tarifa:first-child { border-top:0; }
      .tarifa h2 { max-width:none; color:var(--paper); font-size:clamp(.93rem,3.4vw,1.45rem); font-weight:650; line-height:1.06; letter-spacing:-.045em; white-space:nowrap; }.tarifa p { color:var(--lime); font-size:clamp(1.8rem,6.8vw,3.2rem); font-weight:780; line-height:.85; letter-spacing:-.06em; white-space:nowrap; }.tarifa small { display:inline; margin-left:.24em; color:var(--muted); font-size:.42em; font-weight:650; line-height:1; letter-spacing:0; text-align:left; vertical-align:baseline; }
      .recompensa { margin-top:clamp(26px,5vw,42px); padding:clamp(25px,5vw,42px) clamp(20px,6vw,52px) clamp(32px,6vw,50px); background:var(--lime); color:var(--ink); }.recompensa h2 { max-width:14ch; margin-inline:auto; color:var(--ink); font-size:clamp(2rem,7.4vw,4.45rem); font-weight:760; line-height:.94; letter-spacing:-.055em; text-align:center; }.recompensa-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin-top:clamp(30px,5vw,44px); padding-top:18px; border-top:1px solid var(--ink); }.recompensa-grid div + div { padding-left:20px; border-left:1px solid var(--ink); }.recompensa h3 { margin-bottom:11px; font-size:.96rem; font-weight:700; line-height:1.1; letter-spacing:-.02em; }.recompensa p { font-size:clamp(.9rem,2.75vw,1.15rem); line-height:1.34; }.recompensa strong { display:block; margin-bottom:6px; color:var(--ink); font-size:clamp(1.28rem,4.2vw,2rem); font-weight:780; line-height:.96; letter-spacing:-.045em; }
      .contacto { display:flex; justify-content:center; padding:clamp(50px,9vw,78px) 20px; background:var(--ink); }.whatsapp { display:inline-flex; align-items:center; justify-content:center; min-height:58px; padding:16px 24px; color:var(--ink); background:var(--lime); box-shadow:0 0 0 1px var(--lime),0 0 20px rgba(200,255,50,.38),0 0 44px rgba(200,255,50,.18); text-decoration:none; font-size:1rem; font-weight:800; line-height:1; transition:transform 160ms ease,box-shadow 160ms ease; }.whatsapp-icon { margin-right:.66em; font-size:1.2em; line-height:1; } @media (min-width:761px) { .whatsapp:hover { transform:translateY(-2px); box-shadow:0 0 0 1px var(--lime),0 0 28px rgba(200,255,50,.55),0 0 58px rgba(200,255,50,.25); } }
    </style>
  </head>
  <body>
    <main class="poster">
      <header class="masthead"><h1>Clases de informática</h1></header>
      <section class="tarifas" aria-label="Tarifas">
        <article class="tarifa"><h2>Clase individual</h2><p>20<small>€/h</small></p></article>
        <article class="tarifa"><h2>Grupo de 2</h2><p>18<small>€/h</small></p></article>
        <article class="tarifa"><h2>Grupo de 3 o más</h2><p>16<small>€/h</small></p></article>
      </section>
      <section class="recompensa" aria-labelledby="recompensa-titulo"><h2 id="recompensa-titulo">Traer alumnos tiene recompensa.</h2><div class="recompensa-grid"><div><h3>Clases individuales</h3><p><strong>15 €/h durante un mes</strong>por cada alumno que traigas.</p></div><div><h3>Clases grupales</h3><p><strong>2 € menos</strong>sobre el precio final.</p></div></div></section>
      <footer class="contacto"><a class="whatsapp" target="_blank" rel="noopener" href="https://wa.me/?text=Hola%21%20Estoy%20interesado%20en%20clases%20de%20inform%C3%A1tica."><span class="whatsapp-icon" aria-hidden="true">◉</span>Enviar WhatsApp</a></footer>
    </main>
  </body>
</html>
